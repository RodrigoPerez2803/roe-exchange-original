<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your college | RoeExchange</title>
  <link rel="icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-w="797" data-h="532">
  <div class="screen">
    <header class="bar" style="height: 58px;">
      <a href="index.html"><img class="logo" src="images/logo.png" alt="RoeExchange" style="left: 8px; top: 10px; width: 193px;"></a>
    </header>

    <h1 class="a c" style="left: 0; top: 73px; width: 797px; font-size: 32px; font-weight: 400; line-height: 40px;">What college do you belong to?</h1>
    <div class="line" style="left: 135px; top: 119px; width: 529px; height: 3px;"></div>

    <form id="college-form" novalidate>
      <button type="button" class="college" data-college="Whitelands" style="left: 63px; top: 148px; width: 144px; height: 266px;">
        <img src="images/college-whitelands.jpg" alt="Whitelands mascot, a badger" style="left: 14px;">
        <span class="c-whitelands">Whitelands</span>
      </button>
      <button type="button" class="college" data-college="Digby Stuart" style="left: 239px; top: 148px; width: 142px; height: 266px;">
        <img src="images/college-digby.jpg" alt="Digby Stuart mascot, a lion" style="left: 13px;">
        <span class="c-digby">Digby Stuart</span>
      </button>
      <button type="button" class="college" data-college="Southlands" style="left: 420px; top: 148px; width: 145px; height: 266px;">
        <img src="images/college-southlands.jpg" alt="Southlands mascot, a shark" style="left: 14px;">
        <span class="c-southlands">Southlands</span>
      </button>
      <button type="button" class="college" data-college="Froebel" style="left: 593px; top: 148px; width: 142px; height: 266px;">
        <img src="images/college-froebel.jpg" alt="Froebel mascot, a zebra" style="left: 15px;">
        <span class="c-froebel">Froebel</span>
      </button>

      <button type="submit" class="btn btn-b" style="left: 283px; top: 435px; width: 234px; height: 46px; border-radius: 8px; font-size: 26px;">Create Account</button>
      <a href="details.html" class="a c small-link" data-keep-next style="left: 349px; top: 489px; width: 100px; font-size: 14px; line-height: 18px;">Back</a>

      <p class="a c form-error" style="left: 0; top: 512px; width: 797px; font-size: 12px;">Please choose your college.</p>
    </form>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
