<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product details | RoeExchange</title>
  <link rel="icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-w="485" data-h="667">
  <div class="screen">
    <header class="bar" style="height: 32px;">
      <a href="index.html"><img class="logo" src="images/logo.png" alt="RoeExchange" style="left: 2px; top: 4px; width: 122px;"></a>
    </header>

    <h1 class="a c u" style="left: 0; top: 49px; width: 485px; font-size: 17px; font-weight: 400; line-height: 22px;">Product details</h1>

    <div class="a" style="left: 69px; top: 88px; width: 349px; height: 549px; background: var(--orange); border-radius: 30px;"></div>

    <form data-done="sell-done" novalidate style="color: #000;">
      <label for="title" class="a c" style="left: 69px; top: 98px; width: 349px; font-size: 14px; line-height: 18px;">Product Title</label>
      <input class="pill" id="title" name="title" type="text" required
        style="left: 122px; top: 123px; width: 249px; height: 16px; border-radius: 6px; font-size: 10px;">

      <label for="description" class="a c" style="left: 69px; top: 148px; width: 349px; font-size: 14px; line-height: 18px;">Description of the product</label>
      <input class="pill" id="description" name="description" type="text" required
        style="left: 122px; top: 172px; width: 249px; height: 16px; border-radius: 6px; font-size: 10px;">

      <label for="condition" class="a c" style="left: 69px; top: 197px; width: 349px; font-size: 14px; line-height: 18px;">Product Condition</label>
      <select class="pill" id="condition" name="condition" required
        style="left: 122px; top: 221px; width: 249px; height: 16px; border-radius: 6px; font-size: 10px; padding: 0 8px;">
        <option value=""></option>
        <option>Brand new</option>
        <option>Semi-used</option>
        <option>Used</option>
      </select>

      <label for="price" class="a c" style="left: 69px; top: 246px; width: 349px; font-size: 14px; line-height: 18px;">Best price for this product?</label>
      <input class="pill" id="price" name="price" type="number" min="0" step="0.01" required
        style="left: 124px; top: 268px; width: 249px; height: 16px; border-radius: 6px; font-size: 10px;">

      <label for="negotiable" class="a c" style="left: 69px; top: 293px; width: 349px; font-size: 14px; line-height: 18px;">Can it be negotiated?</label>
      <select class="pill" id="negotiable" name="negotiable" required
        style="left: 122px; top: 318px; width: 249px; height: 16px; border-radius: 6px; font-size: 10px; padding: 0 8px;">
        <option value=""></option>
        <option>Yes</option>
        <option>No</option>
      </select>

      <label for="delivery" class="a c" style="left: 69px; top: 342px; width: 349px; font-size: 14px; line-height: 18px;">Delivery Method</label>
      <input class="pill" id="delivery" name="delivery" type="text" required
        style="left: 122px; top: 367px; width: 249px; height: 16px; border-radius: 6px; font-size: 10px;">

      <p class="a c" style="left: 69px; top: 409px; width: 349px; font-size: 14px; line-height: 18px;">👇 Add a picture of your product here 👇</p>
      <label class="upload" id="sell-upload" title="Add a picture" style="left: 175px; top: 441px; width: 134px; height: 104px; border-radius: 12px;">
        <svg viewBox="0 0 120 100" aria-hidden="true">
          <path d="M24 4v40M4 24h40" stroke="#000" stroke-width="12"/>
          <path d="M54 30h48a8 8 0 0 1 8 8v48a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8V54" fill="none" stroke="#000" stroke-width="9"/>
          <path d="M42 86l18-22 12 13 14-18 18 27z" fill="#000"/>
          <circle cx="90" cy="47" r="7" fill="#000"/>
        </svg>
        <input type="file" accept="image/*" data-preview="sell-upload" aria-label="Product picture">
      </label>

      <p class="a c form-error" style="left: 69px; top: 556px; width: 349px; color: #b3261e; font-size: 11px;">Please fill in every field.</p>

      <button type="submit" class="btn btn-b" style="left: 182px; top: 580px; width: 120px; height: 21px; border-radius: 5px; font-size: 15px;">Submit</button>
      <a href="sell.html" class="a c small-link" style="left: 192px; top: 606px; width: 100px; font-size: 8px; line-height: 10px;">Back</a>
    </form>

    <div class="overlay" id="sell-done">
      <div class="msg">
        <strong>Your product is listed!</strong>
        Other Roehampton students can now see it in the store. We'll let you know when someone wants to make a deal.
        <br>
        <a href="index.html" class="btn btn-b">Back to home</a>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
